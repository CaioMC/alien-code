# ════════════════════════════════════════════════════════════════════════════════
#  Alien Server: configuração padrão
#
#  Para trocar algo só na sua máquina, sem mexer no repositório, crie o arquivo
#  ~/.alien-code/alien.yml com as chaves que quer mudar. Ele é lido por cima deste.
#  Toda chave também pode vir do ambiente: alien.model.default → ALIEN_MODEL_DEFAULT
# ════════════════════════════════════════════════════════════════════════════════

alien:
  # ── 1. Modelos ───────────────────────────────────────────────────────────────
  model:
    default: ollama/qwen3-8b-t10
    # Tempo máximo de uma chamada ao modelo. Na CPU, o system prompt do opencode
    # (~7k tokens) sozinho passa dos 5 min padrão.
    request-timeout: 30m
    providers:
      # Ollama do compose.yaml, visto de dentro da Toca (rede alien-net). Sem chave.
      ollama:
        name: Ollama
        base-url: http://ollama:11434/v1
        models:
          - qwen3-8b-t10        # qwen3:8b com 10 threads na CPU (ollama/qwen3-8b-t10.Modelfile)
          - qwen3:8b

  # ── 2. Missões ────────────────────────────────────────────────────────────────
  mission:
    task-timeout: 45m       # tempo máximo de uma tarefa; ao estourar, a sessão é abortada
    keep-toca: false        # true = mantém a Toca no fim da missão, para depurar (o ttl ainda vale)
    store-path: ${user.home}/.alien-code/alien.db   # SQLite com missões e eventos

  # ── 3. Toca (o container onde o agente trabalha) ──────────────────────────────
  toca:
    image: alien/toca:0.1   # docker build -t alien/toca:0.1 toca/
    network: alien-net      # mesma rede do Ollama no compose.yaml
    memory: 6GB
    cpus: 4
    pids-limit: 512
    ttl: 60m                # Toca esquecida é removida depois disso
    ready-timeout: 60s
    reap-interval: 60s
    agent-port: 4096        # porta do opencode serve dentro da Toca
    agent-username: opencode

  # ── 4. Workspace ──────────────────────────────────────────────────────────────
  workspace:
    # Pastas de onde a API aceita semear repositórios
    allowed-roots:
      - ${user.home}

# ── 5. Servidor ─────────────────────────────────────────────────────────────────
server:
  # Só a máquina do dev: a API aceita caminhos de repositórios locais.
  address: 127.0.0.1
  port: 8080

spring:
  application:
    name: alien-server
  config:
    import: optional:file:${user.home}/.alien-code/alien.yml
  sql:
    init:
      mode: always          # schema.sql cria as tabelas do Event Store se ainda não existirem

logging:
  level:
    dev.aliencode: INFO