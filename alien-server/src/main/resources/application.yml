server:
  # Só a máquina do dev: a API aceita caminhos de repositórios locais.
  address: 127.0.0.1
  port: 8080

spring:
  application:
    name: alien-server
  sql:
    init:
      # schema.sql cria as tabelas do Event Store se ainda não existirem
      mode: always

alien:
  toca:
    image: alien/toca:0.1
    network: alien-net
    agent-port: 4096
    agent-username: opencode
    memory: 6GB
    cpus: 4
    pids-limit: 512
    ttl: 60m
    ready-timeout: 60s
    reap-interval: 60s
  workspace:
    allowed-roots:
      - ${user.home}
  agent:
    # Ollama visto de dentro da Toca: container "ollama" na rede alien-net (compose.yaml)
    base-url: http://ollama:11434/v1
    models:
      - qwen3:8b
    default-model: ollama/qwen3:8b
    # Na CPU, uma chamada com o system prompt do opencode (~7k tokens) passa dos 5 min padrão
    request-timeout: 30m
  mission:
    task-timeout: 45m
    keep-toca: false
    store-path: ${user.home}/.alien-code/alien.db

logging:
  level:
    dev.aliencode: INFO
